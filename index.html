<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pragmatical AI — end-to-end AI implementation</title>
  <meta name="description" content="We implement AI end to end, because we built the layers ourselves: the interface a model writes into, the workflow agents run in, and the modernisation platform that reads the system you already have." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <!-- Bricolage Grotesque for display, IBM Plex Sans for text, IBM Plex Mono for
       figures. Loaded as links rather than a CSS @import: the build carries
       external head links into the worker's document, and an @import inside a
       bundled stylesheet would not survive. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/@swc-js/core/styles/index.css" />
  <link rel="stylesheet" href="/site.css" />
  <script type="importmap">
  {
    "imports": {
      "@swc-js/core": "/@swc-js/core/index.js",
      "@swc-js/core/": "/@swc-js/core/",
      "@swc-js/components": "/@swc-js/components/index.js",
      "@swc-js/components/": "/@swc-js/components/",
      "@swc-js/composites/": "/@swc-js/composites/"
    }
  }
  </script>
</head>

</body>
</html>
